name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BILI_SYNC_ENABLED: 'false'
      CI: 'true'
      HOST: 127.0.0.1
      PORT: '8790'
      WEB_DEV_ORIGIN: http://127.0.0.1:5190
      # CI 只做 lint/typecheck/test，不需要 Electron 二进制。
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated runtime data
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WORKBENCH_DATA_DIR=$env:RUNNER_TEMP\personal-workbench-vnext"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec -- playwright install chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Audit target-volume browser performance
        run: npm run performance:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
